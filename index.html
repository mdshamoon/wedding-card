<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <script>
      // Set the route-specific browser-bar color before Safari samples it.
      (function () {
        var route = window.location.pathname.split("/").filter(Boolean).pop() || "";
        var barColor = "#ffffff";

        if (route === "reception") {
          document.documentElement.dataset.occasion = "reception-pink";
          barColor = "#f4dce2";
        } else if (route === "nikah") {
          document.documentElement.dataset.occasion = "nikah";
          barColor = "#edcbc8";
        } else if (route === "wedding") {
          document.documentElement.dataset.occasion = "wedding";
          barColor = "#e6d6b3";
          try {
            if (localStorage.getItem("wc-theme") === "emerald") {
              document.documentElement.dataset.theme = "emerald";
              barColor = "#0f3d2e";
            }
          } catch (e) {}
        } else {
          document.documentElement.dataset.occasion = "blank";
        }

        var meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = barColor;
        document.head.appendChild(meta);
      })();
    </script>
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Amiri:wght@400;700&family=Cinzel:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
